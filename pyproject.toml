[project]
name = "uname-in-name"
version = "1.1.0"
description = "extera/Ayu-Gram plugin that renders usernames inside user names"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "exteragram-utils>=0.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.15",
]

[tool.ty.environment]
extra-paths = ["stubs"]
